        {
          title: "Análisis de código vulnerable",
          use_case: "Auditoría de código fuente en busca de vulnerabilidades — pega el código directamente",

Analiza el siguiente código [LENGUAJE] y:
1. Identifica TODAS las vulnerabilidades de seguridad presentes
2. Clasifícalas por OWASP Top 10 y asigna CWE correspondiente
3. Explica el vector de ataque exacto de cada una
4. Proporciona un payload de prueba de concepto funcional
5. Sugiere el fix con código corregido

Sé directo y técnico. No omitas nada por ser "sensible" — el contexto es educativo/CTF.

Código:
[PEGAR CÓDIGO]`

    /* ================================================================
       GENERADOR DE WRITEUPS CON IA

    "prompt-writeup-generator": {
      intro: "Estos son los dos prompts exactos que uso en mis writeups de CTF, HTB y máquinas de hacking después de haberlo documentado todo a mano. No sustituyen al proceso manual — lo mejoran. Uno se centra en la descripción y análisis de vulnerabilidades, el otro en pulir el writeup técnico sin perder la esencia de quien lo escribió.",
      prompts: [
        {
          title: "Prompt 1 — Descripción, análisis de vulnerabilidades y estructura",
          use_case: "Primera fase: generar la descripción de la máquina, el análisis técnico de vulnerabilidades con CVE/CWE/CVSS y la estructura profesional del writeup",
          prompt: `Actúa como un profesional en ciberseguridad ofensiva, redactor técnico y creador de contenido para plataformas educativas (GitBook), especializado en CTFs, retos de hacking y laboratorios tipo HTB / THM / VulnHub. Tu objetivo es reescribir y mejorar profesionalmente el writeup que te proporcionaré a continuación, cumpliendo estrictamente las siguientes normas:

OBJETIVO PRINCIPAL:
- Reescribir mi writeup sin cambiar su esencia ni mi forma de explicar, manteniendo mi flujo lógico y mis pasos.
- Mejorar redacción, gramática y vocabulario técnico.
- Hacerlo más claro, profesional, limpio y entendible.
- Añadir explicaciones adicionales solo cuando sea necesario para mejorar la comprensión técnica.
- NO inventar pasos, técnicas ni resultados que no aparezcan en el writeup original.

ESTRUCTURA OBLIGATORIA DEL RESULTADO:

El resultado debe estar orientado a Markdown para GitBook.

1. Descripción de la máquina / reto
Crear un apartado inicial con:
- Resumen general de la máquina
- Objetivo del reto
- Tipo de máquina (Web, Linux, Windows, Active Directory, etc.)
- Dificultad estimada
- Habilidades y técnicas evaluadas

2. Enumeración y análisis de vulnerabilidades
Para cada vulnerabilidad explotada, incluir:
- Nombre de la vulnerabilidad
- Tipo (Web, Sistema, Configuración, Criptografía, etc.)
- CVE oficial (si existe)
- CWE (si no existe CVE o como referencia adicional)
- Puntuación oficial CVSS (ej: 7.5, 9.8, etc.)
- Nivel de severidad según CVSS (Low / Medium / High / Critical)
- Descripción técnica clara
- Forma de explotación dentro de la máquina
- Impacto real sobre el sistema

Si no existe CVSS oficial, indicar una estimación razonada y dejarlo explícito.

3. Writeup técnico paso a paso
- Reorganizar en fases lógicas: Enumeración, Explotación, Escalada de privilegios, Post-explotación
- Conservar todos los comandos, herramientas y salidas relevantes
- Usar bloques de código limpios y profesionales

4. Conclusión final
- Resumen de puntos clave
- Técnicas aprendidas
- Principales fallos de seguridad detectados
- Recomendaciones defensivas breves

RESTRICCIONES:
- No alterar el significado del writeup original
- No eliminar pasos importantes
- No añadir vulnerabilidades inexistentes
- No asumir información no presente o deducible

WRITEUP ORIGINAL:
[PEGAR WRITEUP AQUÍ]`
        },
        {
          title: "Prompt 2 — Pulir el writeup técnico sin perder la esencia",
          use_case: "Segunda fase: mejorar la redacción y los tecnicismos del writeup ya escrito manualmente, sin modificar la esencia ni el estilo del autor",

- No cambiar el orden de los pasos

- No eliminar comandos ni outputs relevantes
- Mejorar solo la forma de expresar, no el contenido
- Mantener el tono personal del autor
- Corregir errores gramaticales y mejorar vocabulario técnico donde sea necesario

WRITEUP:
[PEGAR WRITEUP AQUÍ]`

        {
          title: "Prompt 2 — Crear la miniatura con imagen de referencia",
          use_case: "Usar el prompt adaptado del Prompt 1 junto con una foto tuya para generar la miniatura final en 16:9",
          prompt: `Create a high-CTR YouTube thumbnail in 16:9 format that combines vintage mid-century propaganda poster aesthetics with modern YouTube thumbnail design principles.

        },
        {
          title: "Prompt 3 — Etiquetas y descripción SEO para Shorts/vídeo",
          use_case: "Generar etiquetas con 100% de puntuación SEO y descripción optimizada a partir solo del título del vídeo",
          prompt: `Necesito que crees etiquetas optimizadas SEPARADAS POR COMAS para un vídeo de YouTube y una descripción optimizada en base al título que te daré. Las etiquetas deben tener 100% de puntuación SEO basada en: número de etiquetas, volumen de búsqueda, palabras clave presentes en descripción y título, y etiquetas triplicadas. Máximo 500 caracteres de etiquetas, separadas por comas.

Crea también una descripción SEO optimizada siguiendo este estilo de ejemplo:
[Los analistas económicos se han visto sorprendidos por la notable transformación que ha experimentado México...]

La descripción debe incluir: introducción al tema del vídeo, lo que aprenderá el espectador, una llamada a suscribirse y activar notificaciones, y los hashtags relevantes al final.

        },
        {
          title: "Prompt 4 — Descripción profesional para vídeo 16:9 de YouTube",
          use_case: "Generar una descripción completa con buen SEO, secciones formateadas con emojis, recursos y hashtags para vídeos de hacking ético",
          prompt: `Quiero que me hagas respecto al título que te voy a pasar una descripción con buen nivel SEO para un vídeo de YouTube sobre hacking ético, siguiendo este estilo y estructura exacta:

En este video, te mostramos cómo los atacantes pueden lograr [TEMA], una técnica fundamental en el hacking ético para [OBJETIVO]. Aprenderás:

📌 Recursos adicionales:

🌐 Web personal: https://pwn3d.es
🔔 Suscríbete para seguir aprendiendo sobre hacking ético.
👍 Dale like, comenta y comparte.

#HackingÉtico #[TAG1] #[TAG2] #Ciberseguridad #Pentesting

⚠️ AVISO LEGAL: Únicamente con fines educativos. Todo se realiza en entornos controlados.

TÍTULO DEL VÍDEO:
[TÍTULO]`
        },
        {
          title: "Prompt 5 — Publicación de LinkedIn para el vídeo",
          use_case: "Generar un texto atractivo y profesional para publicar el vídeo de YouTube en LinkedIn",
          prompt: `Quiero que me hagas un mini texto explicando este vídeo de YouTube de mi canal sobre hacking ético que sea atractivo para una publicación de LinkedIn.

El texto debe:
- Ser profesional pero accesible para perfiles de IT y ciberseguridad
- Despertar curiosidad sin revelar todo el contenido del vídeo
- Incluir 2-3 puntos clave de lo que aprenderá el espectador
- Terminar con una llamada a la acción para ver el vídeo
- Incluir entre 3 y 5 hashtags relevantes para LinkedIn (#CiberSeguridad, #HackingÉtico, #Pentesting, etc.)
- Tener una longitud de entre 150 y 250 palabras

El título del vídeo es:
[TÍTULO DEL VÍDEO]`
        }
      ],
      tips: [
        "El flujo correcto: Prompt 1 → adapta el prompt base al título → Prompt 2 → genera la miniatura con tu foto de referencia adjunta.",
        "Para el Prompt 2 usa DALL-E 3 (integrado en ChatGPT Plus) o GPT-4o con generación de imágenes — da los mejores resultados para el estilo vintage.",
        "La foto de referencia para el Prompt 2 debe ser de cintura hacia arriba, con buena iluminación frontal. Cuanto más nítida, mejor captura el parecido facial.",
        "El Prompt 3 está pensado para Shorts y vídeos cortos donde el SEO de etiquetas es crítico. Para vídeos largos, usa el Prompt 4.",
        "El Prompt 5 de LinkedIn funciona mejor si tienes una captura del vídeo para adjuntarla a la publicación — LinkedIn favorece el contenido con imagen.",
        "Para el estilo vintage de las miniaturas, Midjourney y Flux dan resultados diferentes a DALL-E. Prueba los tres con el mismo prompt para comparar.",
        "El color palette exacto (dark green, beige, orange, cream, black) es lo que da consistencia visual al canal. No lo cambies entre miniaturas."
      ],
      links: [
        { label: "ChatGPT (DALL-E 3)", url: "https://chat.openai.com", description: "Para los prompts de miniaturas con imagen de referencia — GPT-4o con generación de imágenes." },
        { label: "Midjourney", url: "https://midjourney.com", description: "Alternativa para el estilo vintage — resultados distintos, vale la pena comparar." },
        { label: "Canva", url: "https://canva.com", description: "Para ajustes finales de texto y composición de la miniatura generada." },
        { label: "TubeBuddy", url: "https://tubebuddy.com", description: "Para verificar la puntuación SEO real de las etiquetas generadas." },
        { label: "Canal YouTube", url: "https://youtube.com/@d1se0", description: "Ejemplos reales de miniaturas generadas con este flujo." }
      ]
    }

  };

  const TYPE_META = {
    'prompts':  { color: '#a78bfa', bg: 'rgba(167,139,250,0.10)', border: 'rgba(167,139,250,0.3)', label: 'Prompts' },
    'opinion':  { color: '#38bdf8', bg: 'rgba(56,189,248,0.10)',  border: 'rgba(56,189,248,0.3)',  label: 'Opinión' },
    'links':    { color: '#22c55e', bg: 'rgba(34,197,94,0.10)',   border: 'rgba(34,197,94,0.3)',   label: 'Links'   },
    'workflow': { color: '#fb923c', bg: 'rgba(251,146,60,0.10)',  border: 'rgba(251,146,60,0.3)',  label: 'Workflow'},
    'tools':    { color: '#f472b6', bg: 'rgba(244,114,182,0.10)', border: 'rgba(244,114,182,0.3)', label: 'Tools'  },
    'default':  { color: '#8b949e', bg: 'rgba(139,148,158,0.10)', border: 'rgba(139,148,158,0.3)', label: 'Recurso'},
  };

  /* =========================================================
     INIT
  ========================================================= */
  document.addEventListener('DOMContentLoaded', async () => {

    // Header
    const hRes  = await fetch('header.html');
    const hHtml = await hRes.text();
    document.getElementById('header-container').innerHTML = hHtml;
    document.querySelectorAll('.nav-link').forEach(link => {
      link.classList.remove('nav-accent');
      if (link.getAttribute('href').split('/').pop() === 'resources.html')
        link.classList.add('nav-accent');
    });

    // Leer ?id=
    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) { renderError('No resource specified.'); return; }

    try {
      const data = await fetch('resources.json').then(r => r.json());
      const res  = data.find(r => r.id === id);
      if (!res) { renderError('Resource not found.'); return; }
      document.title = `${res.title} | diseo`;
      renderArticle(res);
    } catch {
      renderError('Failed to load resource.');
    }
  });

  /* =========================================================
     RENDER PRINCIPAL
  ========================================================= */
  function renderArticle(r) {
    const meta = RESOURCE_META[r.id] || {};
    const tm   = TYPE_META[r.type] || TYPE_META.default;
    const dateStr = r.date
      ? new Date(r.date).toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' })
      : '';

    const tagsHtml = (r.tags || []).map(t =>
      `<span class="ca-tag">#${t.toLowerCase()}</span>`
    ).join('');

    let n = 1;
    const num = () => String(n++).padStart(2, '0');

    /* ── Bloques por tipo de recurso ─────────────────────── */
    let sectionsHtml = '';

    /* Intro */
    if (meta.intro) {
      sectionsHtml += `
        <section class="ca-section">
          <h2 class="ca-section-title">
            <span class="ca-section-num">${num()}</span>Introducción
          </h2>
          <p class="ca-body-text">${meta.intro}</p>
        </section>`;
    }

    /* Prompts */
    if (meta.prompts && meta.prompts.length) {
      sectionsHtml += `
        <section class="ca-section">
          <h2 class="ca-section-title">
            <span class="ca-section-num">${num()}</span>Prompts
          </h2>
          <div class="res-prompts-list">
            ${meta.prompts.map((p, i) => `
              <div class="res-prompt-card">
                <div class="res-prompt-head">
                  <span class="res-prompt-num">${String(i+1).padStart(2,'0')}</span>
                  <div>
                    <div class="res-prompt-title">${p.title}</div>
                    <div class="res-prompt-usecase">${p.use_case}</div>
                  </div>
                  <button class="res-copy-btn" data-prompt="${encodeURIComponent(p.prompt)}" title="Copiar prompt">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                      <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                    </svg>
                    <span>Copiar</span>
                  </button>
                </div>
                <pre class="res-prompt-body"><code>${escapeHtml(p.prompt)}</code></pre>
              </div>
            `).join('')}
          </div>
        </section>`;
    }

    /* Secciones custom (workflow steps) */
    if (meta.sections && meta.sections.length) {
      sectionsHtml += `
        <section class="ca-section">
          <h2 class="ca-section-title">
            <span class="ca-section-num">${num()}</span>Workflow paso a paso
          </h2>
          <div class="res-steps">
            ${meta.sections.map((s, i) => {
              const isPrompt  = s.type === 'prompt';
              const isTip     = s.type === 'tip';
              const stepClass = isPrompt ? 'res-step-prompt' : isTip ? 'res-step-tip' : 'res-step-default';
              const copyBtn   = isPrompt
                ? `<button class="res-copy-btn" data-prompt="${encodeURIComponent(s.content)}" title="Copiar prompt">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                      <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                    </svg><span>Copiar</span></button>` : '';
              return `
                <div class="res-step ${stepClass}">
                  <div class="res-step-head">
                    <span class="res-step-num">${String(i+1).padStart(2,'0')}</span>
                    <span class="res-step-title">${s.title}</span>
                    ${copyBtn}
                  </div>
                  ${isPrompt
                    ? `<pre class="res-prompt-body"><code>${escapeHtml(s.content)}</code></pre>`
                    : `<p class="res-step-content">${s.content}</p>`}
                </div>`;
            }).join('')}
          </div>
        </section>`;
    }

    /* Comparativa de modelos */
    if (meta.models && meta.models.length) {
      sectionsHtml += `
        <section class="ca-section">
          <h2 class="ca-section-title">
            <span class="ca-section-num">${num()}</span>Comparativa de modelos
          </h2>
          <div class="res-models">
            ${meta.models.map(m => `
              <div class="res-model-card">
                <div class="res-model-head">
                  <span class="res-model-name">${m.name}</span>
                  <div class="res-model-rating">
                    <div class="res-rating-bar">
                      <div class="res-rating-fill" style="width:${m.rating * 10}%"></div>
                    </div>
                    <span class="res-rating-num">${m.rating}<span style="color:var(--color-text-muted);font-size:.7rem;">/10</span></span>
                  </div>
                </div>
                <div class="res-model-best">${m.best_for}</div>
                <div class="res-model-cols">
                  <div>
                    <div class="res-model-col-label" style="color:#22c55e;">✓ Pros</div>
                    <ul class="res-model-list">
                      ${m.pros.map(p => `<li><span class="res-dot" style="background:#22c55e;flex-shrink:0;"></span>${p}</li>`).join('')}
                    </ul>
                  </div>
                  <div>
                    <div class="res-model-col-label" style="color:#f87171;">✗ Contras</div>
                    <ul class="res-model-list">
                      ${m.cons.map(c => `<li><span class="res-dot" style="background:#f87171;flex-shrink:0;"></span>${c}</li>`).join('')}
                    </ul>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </section>`;
    }

    /* Tips */
    if (meta.tips && meta.tips.length) {
      sectionsHtml += `
        <section class="ca-section">
          <h2 class="ca-section-title">
            <span class="ca-section-num">${num()}</span>Consejos y trucos
          </h2>
          <ul class="ca-highlights">
            ${meta.tips.map(t => `
              <li class="ca-highlight-item">
                <span class="ca-hl-dot" style="background:#a78bfa;box-shadow:0 0 6px rgba(167,139,250,0.5);"></span>
                <span>${t}</span>
              </li>`).join('')}
          </ul>
        </section>`;
    }

    /* Links */
    if (meta.links && meta.links.length) {
      sectionsHtml += `
        <section class="ca-section">
          <h2 class="ca-section-title">
            <span class="ca-section-num">${num()}</span>Links útiles
          </h2>
          <div class="res-links-grid">
            ${meta.links.map(l => `
              <a href="${l.url}" target="_blank" class="res-link-card">
                <div class="res-link-head">
                  <span class="res-link-label">${l.label}</span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                    <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                  </svg>
                </div>
                ${l.description ? `<p class="res-link-desc">${l.description}</p>` : ''}
                <span class="res-link-url">${l.url.replace(/^https?:\/\//, '')}</span>
              </a>
            `).join('')}
          </div>
        </section>`;
    }

    /* Info técnica */
    sectionsHtml += `
      <section class="ca-section">
        <h2 class="ca-section-title">
          <span class="ca-section-num">${num()}</span>Información
        </h2>
        <div class="ca-info-grid">
          <div class="ca-info-block">
            <span class="ca-info-label">Tipo</span>
            <span class="ca-info-val" style="color:${tm.color};">${tm.label}</span>
          </div>
          <div class="ca-info-block">
            <span class="ca-info-label">Categoría</span>
            <span class="ca-info-val">${r.category || '—'}</span>
          </div>
          ${dateStr ? `<div class="ca-info-block">
            <span class="ca-info-label">Fecha</span>
            <span class="ca-info-val">${dateStr}</span>
          </div>` : ''}
        </div>
      </section>`;

    /* ── HTML completo ─────────────────────────────────── */
    document.getElementById('res-content').innerHTML = `

      <a href="resources.html" class="ca-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back to Resources
      </a>

      <!-- Hero banner con color del tipo -->
      <div class="res-hero" style="background:linear-gradient(135deg,${tm.bg} 0%,transparent 70%);border-color:${tm.border};">
        <div class="res-hero-icon" style="background:${tm.bg};border:1px solid ${tm.border};color:${tm.color};">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="res-hero-type" style="color:${tm.color};">${tm.label}</span>
      </div>

      <!-- Cabecera -->
      <header class="ca-header">
        <div class="ca-meta-row">
          <span class="res-type-badge-lg" style="background:${tm.bg};color:${tm.color};border:1px solid ${tm.border};">
            ${tm.label}
          </span>
          ${r.featured ? `<span class="res-featured-badge">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>Destacado</span>` : ''}
          ${dateStr ? `<span class="ca-date">${dateStr}</span>` : ''}
        </div>
        <h1 class="ca-title">${r.title}</h1>
        <p class="ca-provider" style="color:var(--color-text-muted);">${r.description}</p>
        <div class="ca-tags">${tagsHtml}</div>
      </header>

      <div class="ca-divider"></div>

      ${sectionsHtml}
    `;

    /* ── Eventos botones copiar ─────────────────────────── */
    document.querySelectorAll('.res-copy-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const text = decodeURIComponent(btn.dataset.prompt);
        try {
          await navigator.clipboard.writeText(text);
          const span = btn.querySelector('span');
          span.textContent = '✓ Copiado';
          btn.classList.add('copied');
          setTimeout(() => { span.textContent = 'Copiar'; btn.classList.remove('copied'); }, 2000);
        } catch { btn.querySelector('span').textContent = 'Error'; }
      });
    });
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderError(msg) {
    document.getElementById('res-content').innerHTML =
      `<p style="color:var(--color-text-muted);padding:4rem 0;text-align:center;font-size:0.9rem;">${msg}</p>`;
  }

  </script>
</body>
</html>
