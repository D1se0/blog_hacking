<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheatSheet | diseo</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/blog.css">
  <link rel="stylesheet" href="css/cheatsheet.css">
  <script src="js/rate-limit.js"></script>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <div id="header-container"></div>
  <main class="mx-auto w-full max-w-4xl px-4 py-8">
    <section class="page-section">
      <div class="page-hero">
        <span class="section-label">// reference</span>
        <h1 class="page-title">CheatSheets</h1>
        <p class="page-desc">Cheatsheets de Linux y Windows organizados por categoría.</p>
      </div>

      <!-- OS filter + action buttons -->
      <div class="filter-row" id="filter-container">
        <button id="filter-all"     class="cs-filter-btn">All</button>
        <button id="filter-linux"   class="cs-filter-btn">Linux</button>
        <button id="filter-windows" class="cs-filter-btn">Windows</button>
        <div class="filter-actions">
          <a href="view.html?cheatsheet=exercises" class="practice-btn">🧪 Practicar Bash</a>
          <a href="https://d1se0.github.io/sql-learning/" class="practice-btn">🗄️ SQL Learning</a>
        </div>
      </div>

      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search cheatsheets..." class="search-input">
      </div>

      <div id="tags-container" class="tags-row"></div>
      <div id="cheatsheet-grid" class="cs-grid"></div>
      <div id="pagination-container" class="pagination-row"></div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-inner mx-auto max-w-4xl px-4">
      <span class="footer-logo">diseo<span style="color:var(--color-text-muted)">@</span>hacker</span>
      <span class="footer-copy">Built with ♥ &amp; caffeine</span>
    </div>
  </footer>
  <script src="js/cheatsheet.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => { initCheatSheet(); });
  </script>
</body>
</html>
